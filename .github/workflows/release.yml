name: Release

# The changesets flow. On push to main:
#   - if there are pending changesets, open/update a "Version package" PR (bump + changelog);
#   - if there are none (i.e. that PR was just merged), publish to npm and tag a GitHub release.
#
# Publishing uses npm Trusted Publishing (OIDC) — no npm token. Requires id-token: write and
# npm >= 11.5.1. The Version PR is opened with GITHUB_TOKEN, so PR checks don't run on it;
# this job validates (generated code, build, tests) before publishing instead.
on:
  push:
    branches: [main]
  workflow_dispatch: # manual "Run workflow" trigger — publishes any unpublished version on main

concurrency: release-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # npm >= 11.5.1 for OIDC. Not 12: its `npm info --json` returns an array, which changesets
      # misreads as "never published" and tries to republish the current version.
      - name: Ensure OIDC-capable npm
        run: npm install -g npm@11
      # Validate in its own step: changesets/action runs `publish` without a shell, so a compound
      # `npm run build && …` command sends `&& …` to tsc as arguments instead of chaining.
      - name: Validate
        run: npm run validate
      - uses: changesets/action@v1
        with:
          version: npm run version
          publish: npx changeset publish
          commit: Version package
          title: Version package
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
